name: orbit
x-app: &app
  build: .
  image: orbit-app:local
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 128
  mem_limit: 768m
  volumes:
    - orbit_data:/data
  environment: &environment
    ORBIT_ENV: production
    ORBIT_PUBLIC_URL: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN in .env}
    ORBIT_SECURE_COOKIE: "1"
    ORBIT_SIGNUP_ENABLED: ${ORBIT_SIGNUP_ENABLED:-1}
    ORBIT_MAX_USERS: ${ORBIT_MAX_USERS:-100}
    CONTROL_DB: /data/control.db
    OLLAMA_URL: http://ollama:11434
  networks: [backend]
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?Set ORBIT_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on: [api]
    mem_limit: 256m
    pids_limit: 100
  api:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/auth/status',headers={'Host':os.environ['ORBIT_PUBLIC_URL'].split('://')[1]}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: ["python", "-m", "backend.worker"]
    networks: [backend, edge]
    depends_on:
      api:
        condition: service_healthy
      ollama:
        condition: service_started
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend, edge]
    mem_limit: 6g
    pids_limit: 256
volumes:
  orbit_data:
  ollama_data:
  caddy_data:
  caddy_config:
networks:
  backend:
    internal: true
  edge:
